name: Publish Config Pack

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CURSEFORGE_API_KEY:
        required: true
      MODRINTH_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to re-publish (e.g. 2.1.3-1.21)'
        required: true
        type: string

jobs:
  publish-config-pack:
    name: Publish Config Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and publish config pack
        shell: bash
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew buildDatapack publishCurseforgeDatapack publishModrinthDatapack
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
