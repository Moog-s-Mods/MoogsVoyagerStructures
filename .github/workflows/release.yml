name: Release

on:
  push:
    tags:
      - '*.*.*-*.*.*'

permissions:
  contents: write

jobs:
  release:
    uses: FinnSetchell/release-actions/.github/workflows/release.yml@v1
    with:
      validate: true
      configPack: 'curseforge modrinth'
    secrets:
      WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
