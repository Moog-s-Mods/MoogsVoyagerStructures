name: Build

on:
  push:
    branches: ['**']
    # Fleet-standard release tags (<X.Y.Z>-<mc>) are handled by release.yml.
    tags-ignore: ['*.*.*-*', '*.*.*-alpha.*-*']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew build
          echo "---- build/libs contents ----"
          ls -la build/libs/
